name: Публикация сайта
# При каждом push в main папка web/ копируется в ветку gh-pages, откуда GitHub Pages показывает сайт.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: web/ → gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          touch web/.nojekyll
          git add -f web/.nojekyll
          git commit -m "nojekyll" || true
          git push -f origin "$(git subtree split --prefix web HEAD)":refs/heads/gh-pages
