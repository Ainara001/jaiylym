name: Проверки
# Все тесты на каждом pull request и push в main:
#  - npm test — модель, план, спутниковая обработка (без сети), API, бот, ИИ с подменой сети, словари;
#  - e2e — путь пользователя в Chromium и WebKit (движок Safari на iPhone), включая скачивание PDF;
#  - net — живые запросы к Microsoft Planetary Computer (реальные снимки Sentinel-2 и WorldCover).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (Chromium и WebKit)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Путь пользователя на ПК и телефоне
        env:
          JAIYLYM_BROWSERS: chromium,webkit
        run: npm run test:e2e
  net:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Реальные снимки Sentinel-2 (Planetary Computer)
        run: npm run test:net
  nograze-kegen:
    # где нельзя пасти для Кегена: OSM + WorldCover (нужен интернет) → файл для web/data/plots.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/add_nograze.js
      - name: Зоны Кегена в журнал (сжатый JSON, для переноса в web/data без доступа к файлам артефактов)
        run: |
          node -e 'const z=require("zlib");const D=require("./web/data/plots.json");const b=z.gzipSync(JSON.stringify(D.nograze)).toString("base64");console.log("NOGRAZE-BEGIN");for(let i=0;i<b.length;i+=900)console.log("NG:"+b.slice(i,i+900));console.log("NOGRAZE-END "+require("crypto").createHash("sha256").update(JSON.stringify(D.nograze)).digest("hex"))'
      - uses: actions/upload-artifact@v4
        with:
          name: kegen-nograze
          path: |
            web/data/plots.js
            web/data/plots.json
