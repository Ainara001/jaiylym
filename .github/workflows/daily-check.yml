name: Ежедневная проверка участков
# Каждый день в 09:00 по Алматы будит бота на Render и просит проверить новые снимки Sentinel-2
# по участкам, на которые подписаны пастухи, и разослать напоминания о перегоне.
# Доступ к /cron — по OIDC-токену GitHub (сервер проверяет подпись GitHub, репозиторий, этот файл и ветку main).
# Общий пароль не нужен; если в GitHub задан секрет CRON_SECRET, он тоже передаётся (запасной способ).
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Разбудить бота (бесплатный сервер спит)
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -m 60 https://jaiylym-bot.onrender.com/health; then echo; exit 0; fi
            echo "ещё спит, жду…"; sleep 20
          done
          exit 1
      - name: Проверить участки
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jaiylym-cron" | jq -r .value)
          ARGS=(-H "Authorization: Bearer $TOKEN")
          if [ -n "$CRON_SECRET" ]; then ARGS+=(-H "X-Cron-Secret: $CRON_SECRET"); fi
          for i in 1 2 3; do
            code=$(curl -sS -m 300 -o out.txt -w "%{http_code}" -X POST "${ARGS[@]}" https://jaiylym-bot.onrender.com/cron || echo 000)
            cat out.txt 2>/dev/null; echo
            [ "$code" = "200" ] && exit 0
            echo "ответ $code"
            [ "$code" = "401" ] && exit 1                 # доступ запрещён — повтор не поможет
            sleep 30
          done
          exit 1
