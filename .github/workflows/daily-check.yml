name: Ежедневная проверка участков
# Каждый день в 09:00 по Алматы будит бота на Render и просит проверить новые снимки Sentinel-2
# по участкам, на которые подписаны пастухи, и разослать напоминания о перегоне.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Разбудить бота (бесплатный сервер спит)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -m 60 https://jaiylym-bot.onrender.com/health && exit 0
            echo "ещё спит, жду…"; sleep 20
          done
          exit 1
      - name: Проверить участки
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Секрет CRON_SECRET не задан в GitHub — см. README"; exit 1; fi
          curl -fsS -m 300 -X POST -H "X-Cron-Secret: $CRON_SECRET" https://jaiylym-bot.onrender.com/cron
          echo
